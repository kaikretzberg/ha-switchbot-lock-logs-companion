# Replace this entity ID with your Log Count sensor (in both places).
type: markdown
title: Ereignisprotokoll
entity_id: sensor.YOUR_LOCK_LOG_COUNT
content: |
  {% set entity = config.entity_id %}
  {% set logs = state_attr(entity, 'logs') or [] %}
  {% set actions = {'lock': 'Verriegelt', 'unlatch': 'Riegel entriegelt', 'unlock': 'Entriegelt', 'jammed': 'Blockiert', 'unlock_failed': 'Entriegeln fehlgeschlagen', 'lock_failed': 'Verriegeln fehlgeschlagen'} %}
  {% set sources = {'app': 'App-Steuerung', 'keypad': 'Tastenfeld', 'manual': 'Manuell', 'auto_lock': 'Automatische Verriegelung', 'nfc': 'NFC', 'remote': 'Fernsteuerung', 'fingerprint': 'Fingerabdruck'} %}
  {% if not has_value(entity) %}
  Schlossprotokoll ist nicht verfügbar: {{ states(entity) }}
  {% elif not logs %}
  Noch keine Ereignisse abgerufen.
  {% else %}
  {% set day = namespace(value='') %}
  {% for log in logs %}
  {% set date = log.timestamp | timestamp_custom('%d.%m.%Y', true) %}
  {% if date != day.value %}
  ## {{ date }}
  {% set day.value = date %}
  {% endif %}
  <ha-icon icon="{{ 'mdi:lock' if log.action_name == 'lock' else 'mdi:lock-open' if log.action_name == 'unlock' else 'mdi:alert-circle-outline' }}"></ha-icon> **{{ actions.get(log.action_name, log.action_name) | e }}** · {{ log.timestamp | timestamp_custom('%H:%M', true) }}
  <br>{{ (log.user_name or 'Benutzer unbekannt') | e }} · {{ sources.get(log.source_name, log.source_name) | e }}
  <small>Action {{ log.action }} · Source {{ log.source }} · Payload {{ log.payload | e }}</small>
  {% if log.user_id is not none %}
  <small>ID {{ log.user_id }}</small>
  {% endif %}
  
  ---
  {% endfor %}
  {% endif %}
