# Standard Home Assistant Markdown card. Replace the entity ID below.
type: markdown
title: Wer hat geöffnet?
entity_id: sensor.YOUR_LOCK_LAST_ACCESS
content: |
  {% set entity = config.entity_id %}
  {% set history = state_attr(entity, 'history') or [] %}
  {% if not has_value(entity) %}
  Schlossprotokoll momentan nicht verfügbar. Gespeicherte Zutritte stehen unten.
  {% endif %}
  {% if state_attr(entity, 'sync_pending') %}
  Neuer Zutritt wird abgerufen …
  {% endif %}
  {% for entry in history[:30] %}
  **{{ entry.name | e }}** · geöffnet
  <br>{{ entry.time | e }}

  ---
  {% else %}
  Noch keine Fingerabdruck-Zutritte gespeichert.
  {% endfor %}
